<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informe de Datos — Docta Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f4;--surface:#ffffff;--ink:#15151a;--ink-soft:#54565f;--ink-faint:#93959e;
  --line:#e3e2dc;--up:#1f7a4d;--down:#b23b3b;--brand:#15151a;
  --sans:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}

#gate{position:fixed;inset:0;background:#0b0b0e;display:flex;align-items:center;justify-content:center;padding:1.5rem;z-index:50}
.gate-card{width:100%;max-width:380px;background:#1c1c22;border:1px solid #2c2c34;border-radius:12px;padding:2.2rem 2rem;text-align:center}
.gate-eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8f8fff;margin-bottom:.6rem}
.gate-title{font-size:1.25rem;font-weight:600;color:#f4f3ef;margin-bottom:.4rem}
.gate-sub{font-size:12.5px;color:#9a9aa4;margin-bottom:1.6rem;line-height:1.5}
.gate-input{width:100%;background:#131318;border:1px solid #33333c;border-radius:8px;color:#f4f3ef;font-family:var(--mono);font-size:17px;letter-spacing:.22em;text-align:center;padding:12px;outline:none;margin-bottom:.8rem}
.gate-input:focus{border-color:var(--brand)}
.gate-btn{width:100%;background:#3d7fe0;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;padding:12px;cursor:pointer}
.gate-btn:disabled{opacity:.6}
.gate-err{color:#f0a5a5;font-size:12px;margin-top:.6rem;display:none}
.gate-expiry{margin-top:1.2rem;font-size:11px;color:#6a6a76}

#report{display:none;max-width:1100px;margin:0 auto;padding:0 1.5rem 3rem}
#report.on{display:block}

.fr-topbar{position:sticky;top:0;z-index:10;background:rgba(246,246,244,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:.9rem 1.5rem;margin:0 -1.5rem 1.5rem;display:flex;justify-content:space-between;align-items:center}
.fr-topbar-name{font-weight:600;font-size:14px}
.fr-topbar-tag{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);border:1px solid var(--line);border-radius:4px;padding:2px 8px;margin-left:8px}
.fr-topbar-right{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}

.fr-sec{margin-bottom:1.6rem}
.fr-sec-title{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);margin-bottom:.6rem;padding-bottom:.4rem;border-bottom:1px solid var(--line)}

.fr-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fr-card{background:var(--surface);border-radius:8px;padding:10px 12px}
.fr-card-label{font-size:10.5px;color:var(--ink-soft);margin-bottom:2px}
.fr-card-val{font-size:19px;font-weight:600;font-family:var(--mono)}
.fr-card-delta{font-size:10.5px;margin-top:2px}
.fr-up{color:var(--up)}
.fr-down{color:var(--down)}

table.fr-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:8px;overflow:hidden}
table.fr-table th{text-align:left;font-weight:500;color:var(--ink-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;padding:8px 10px;border-bottom:1px solid var(--line)}
table.fr-table td{padding:7px 10px;border-bottom:1px solid var(--line);font-size:12.5px}
table.fr-table tr:last-child td{border-bottom:none}
table.fr-table td.num{text-align:right;font-family:var(--mono)}
.fr-empty{padding:1rem;color:var(--ink-faint);font-size:12px;background:var(--surface);border-radius:8px}
.fr-tag{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;background:var(--bg);color:var(--ink-soft)}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="gate-eyebrow">Docta Nexus — Datos</div>
    <div class="gate-title" id="gateBizName">Informe de datos</div>
    <div class="gate-sub">Ingresá el código de acceso que te compartió tu agencia.</div>
    <input type="text" id="gateCode" class="gate-input" placeholder="000000" maxlength="6" inputmode="numeric">
    <button class="gate-btn" id="gateBtn" onclick="unlockReport()">Ver informe</button>
    <div class="gate-err" id="gateErr"></div>
    <div class="gate-expiry" id="gateExpiry"></div>
  </div>
</div>

<div id="report">
  <div class="fr-topbar">
    <div><span class="fr-topbar-name" id="frBizName"></span><span class="fr-topbar-tag" id="frPeriod"></span></div>
    <div class="fr-topbar-right" id="frStamp"></div>
  </div>

  <div id="frBody"></div>
</div>

<script>
const token = location.pathname.split('/').filter(Boolean).pop();
let REPORT = null;

function num(v){ if(v==null) return 'N/D'; return Math.round(v).toLocaleString('es-AR'); }
function money(v){ if(v==null) return 'N/D'; return '$'+Math.round(v).toLocaleString('es-AR'); }
function pct(v){ if(v==null) return 'N/D'; return v+'%'; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(iso){ if(!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'}); }

async function initGate(){
  try{
    const r = await fetch(`/api/report-frio/${token}/meta`);
    const d = await r.json();
    if(!r.ok){ gateError(d.error || 'Este informe no existe.'); return; }
    document.getElementById('gateBizName').textContent = d.business_name || 'Informe de datos';
    if(d.expired){
      gateError('Este informe venció. Pedile a tu agencia que te comparta uno nuevo.');
      document.getElementById('gateExpiry').innerHTML = '';
      document.getElementById('gateCode').style.display = 'none';
      document.getElementById('gateBtn').style.display = 'none';
      return;
    }
    document.getElementById('gateExpiry').textContent = 'Este link expira el ' + fmtDate(d.expires_at);
  }catch(e){
    gateError('No pudimos cargar el informe. Probá de nuevo en unos minutos.');
  }
}
function gateError(msg){
  const el = document.getElementById('gateErr');
  el.textContent = msg;
  el.style.display = 'block';
}
initGate();

async function unlockReport(){
  const code = document.getElementById('gateCode').value.trim();
  const btn = document.getElementById('gateBtn');
  if(code.length < 4){ gateError('Ingresá el código completo.'); return; }
  btn.disabled = true; btn.textContent = 'Verificando…';
  try{
    const r = await fetch(`/api/report-frio/${token}/unlock`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ code })
    });
    const d = await r.json();
    if(!r.ok){ gateError(d.error || 'Código incorrecto.'); btn.disabled=false; btn.textContent='Ver informe'; return; }
    REPORT = d;
    renderReport(d);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('report').classList.add('on');
  }catch(e){
    gateError('No pudimos verificar el código. Probá de nuevo.');
    btn.disabled = false; btn.textContent = 'Ver informe';
  }
}
document.getElementById('gateCode').addEventListener('keydown', e => { if(e.key==='Enter') unlockReport(); });

function deltaEl(cur, prev, invert){
  if(cur==null || prev==null || prev===0) return '';
  const d = ((cur-prev)/prev)*100;
  if(Math.abs(d) < 0.1) return '';
  const good = invert ? d < 0 : d > 0;
  return `<div class="fr-card-delta ${good?'fr-up':'fr-down'}">${d>0?'+':''}${d.toFixed(1)}%</div>`;
}
function card(label, val, deltaHtml){
  return `<div class="fr-card"><div class="fr-card-label">${esc(label)}</div><div class="fr-card-val">${val}</div>${deltaHtml||''}</div>`;
}
function sectionWrap(title, bodyHtml){
  return `<div class="fr-sec"><div class="fr-sec-title">${esc(title)}</div>${bodyHtml}</div>`;
}
function table(headers, rows){
  if(!rows.length) return `<div class="fr-empty">Sin datos en este período.</div>`;
  return `<table class="fr-table"><thead><tr>${headers.map(h=>`<th${h.num?' style="text-align:right"':''}>${esc(h.label)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
}

function renderReport(d){
  document.getElementById('frBizName').textContent = d.business_name || '';
  document.getElementById('frPeriod').textContent = d.period_label || '';
  if(d.data_retrieved_at){
    const dt = new Date(d.data_retrieved_at);
    document.getElementById('frStamp').textContent = 'Datos al ' + dt.toLocaleDateString('es-AR',{day:'2-digit',month:'short'}) + ' ' + dt.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  }

  const anchors = d.anchors || {};
  const on = k => anchors[k] !== false;
  const body = document.getElementById('frBody');
  let html = '';

  const m = d.meta, g = d.google, an = d.analytics, ec = d.ecommerce;

  // ── Meta — Rendimiento ──
  if(on('meta_rendimiento') && m){
    html += sectionWrap('Meta Ads — Rendimiento', `<div class="fr-cards">
      ${card('Inversión', money(m.spend))}
      ${card('Compras', num(m.purchases))}
      ${card('Valor de compras', money(m.revenue))}
      ${card('ROAS', m.roas!=null?m.roas.toFixed(2)+'x':'N/D')}
      ${card('CPA', money(m.cpa))}
      ${card('Clics', num(m.clicks))}
      ${card('CTR', pct(m.ctr))}
      ${card('CPM', money(m.cpm))}
    </div>`);
  }

  // ── Meta — Alcance y frecuencia ──
  if(on('meta_alcance') && m){
    html += sectionWrap('Meta Ads — Alcance y frecuencia', `<div class="fr-cards">
      ${card('Alcance', num(m.reach))}
      ${card('Impresiones', num(m.impressions))}
      ${card('Frecuencia', m.frequency!=null?m.frequency:'N/D')}
      ${card('Clics únicos', num(m.uniqueClicks))}
    </div>`);
  }

  // ── Meta — Funnel propio ──
  if(on('meta_funnel') && m){
    html += sectionWrap('Meta Ads — Funnel propio (píxel Meta)', `<div class="fr-cards">
      ${card('Vistas de landing', num(m.landingPageViews))}
      ${card('Clics al link', num(m.linkClicks))}
      ${card('Agregado al carrito', num(m.addToCart))}
      ${card('Checkout iniciado', num(m.initiateCheckout))}
    </div>`);
  }

  // ── Meta — Mensajería y leads nativos ──
  if(on('meta_mensajeria') && m){
    html += sectionWrap('Meta Ads — Mensajería y leads nativos', `<div class="fr-cards">
      ${card('Mensajes iniciados', num(m.messagingConn))}
      ${card('Costo por mensaje', money(m.cpmsg))}
      ${card('Primera respuesta', num(m.messagingFirstReply))}
      ${card('Leads (formulario nativo)', num(m.leadgenLeads))}
    </div>`);
  }

  // ── Meta — Engagement social ──
  if(on('meta_engagement') && m){
    html += sectionWrap('Meta Ads — Engagement social', `<div class="fr-cards">
      ${card('Reacciones', num(m.postReactions))}
      ${card('Comentarios', num(m.postComments))}
      ${card('Compartidos', num(m.postShares))}
      ${card('Guardados', num(m.postSaves))}
      ${card('Nuevos seguidores (Page)', num(m.newFollowersPage))}
      ${card('Nuevos seguidores (IG)', num(m.newFollowersIG))}
      ${card('Visitas a perfil IG', num(m.igProfileVisits))}
      ${card('Engagement total', num(m.postEngagement))}
    </div>`);
  }

  // ── Meta — Video (solo si hay actividad real) ──
  if(on('meta_video') && m && m.hasVideoActivity){
    html += sectionWrap('Meta Ads — Video', `<div class="fr-cards">
      ${card('Vistas (3s)', num(m.videoViews))}
      ${card('Vistas 10s', num(m.videoViews10s))}
      ${card('Vistas 30s', num(m.videoViews30s))}
      ${card('ThruPlay (100%)', num(m.thruPlays))}
      ${card('% que llega a ThruPlay', m.videoAvgWatchPct!=null?m.videoAvgWatchPct+'%':'N/D')}
    </div>`);
  }

  // ── Meta — Resumen de campañas ──
  if(on('meta_campanas') && d.meta_campaigns && d.meta_campaigns.length){
    const rows = d.meta_campaigns.map(c => `<tr>
      <td>${esc(c.name||'')}${c.status?` <span class="fr-tag">${esc(c.status)}</span>`:''}</td>
      <td class="num">${money(c.spend)}</td>
      <td class="num">${c.roas!=null?c.roas.toFixed(2)+'x':'N/D'}</td>
      <td class="num">${num(c.purchases)}</td>
      <td class="num">${pct(c.ctr)}</td>
    </tr>`).join('');
    html += sectionWrap('Meta Ads — Resumen de campañas', table(
      [{label:'Campaña'},{label:'Inversión',num:1},{label:'ROAS',num:1},{label:'Compras',num:1},{label:'CTR',num:1}], rows
    ));
  }

  // ── Google — Rendimiento ──
  if(on('google_rendimiento') && g){
    html += sectionWrap('Google Ads — Rendimiento', `<div class="fr-cards">
      ${card('Inversión', money(g.spend))}
      ${card('Conversiones', num(g.conversions))}
      ${card('Valor de conversión', money(g.conversion_value))}
      ${card('ROAS', g.roas!=null?g.roas.toFixed(2)+'x':'N/D')}
      ${card('CPA', money(g.cpa))}
      ${card('Clics', num(g.clicks))}
      ${card('CTR', pct(g.ctr))}
      ${card('CPM', money(g.cpm))}
    </div>`);
  }

  // ── Google — Cuota de impresión ──
  if(on('google_impression_share') && g && g.search_top_impression_share != null){
    html += sectionWrap('Google Ads — Cuota de impresión de búsqueda', `<div class="fr-cards">
      ${card('IS parte superior', pct(g.search_top_impression_share))}
      ${card('IS absoluta superior', pct(g.search_absolute_top_impression_share))}
      ${card('Perdida por presupuesto', pct(g.search_budget_lost_impression_share))}
    </div>`);
  }

  // ── Google — Resumen de campañas ──
  if(on('google_campanas') && d.google_campaigns && d.google_campaigns.length){
    const rows = d.google_campaigns.map(c => `<tr>
      <td>${esc(c.campaign_name||'')}${c.status?` <span class="fr-tag">${esc(c.status)}</span>`:''}</td>
      <td class="num">${money(c.spend)}</td>
      <td class="num">${c.roas!=null?c.roas.toFixed(2)+'x':'N/D'}</td>
      <td class="num">${num(c.conversions)}</td>
      <td class="num">${pct(c.ctr)}</td>
    </tr>`).join('');
    html += sectionWrap('Google Ads — Resumen de campañas', table(
      [{label:'Campaña'},{label:'Inversión',num:1},{label:'ROAS',num:1},{label:'Conversiones',num:1},{label:'CTR',num:1}], rows
    ));
  }

  // ── Google — Performance Max / Shopping — productos ──
  if(on('google_pmax_productos') && d.pmax_products && d.pmax_products.length){
    const rows = d.pmax_products.slice(0,20).map(p => `<tr>
      <td>${esc(p.title||'')}${p.diagnostico && p.diagnostico!=='ok'?` <span class="fr-tag">${p.diagnostico==='sin_impresiones'?'sin impresiones':'sin clics'}</span>`:''}</td>
      <td class="num">${num(p.impressions)}</td>
      <td class="num">${num(p.clicks)}</td>
      <td class="num">${money(p.cost)}</td>
      <td class="num">${p.roas!=null?p.roas.toFixed(2)+'x':'N/D'}</td>
    </tr>`).join('');
    html += sectionWrap('Google Ads — Performance Max / Shopping: productos', table(
      [{label:'Producto'},{label:'Impresiones',num:1},{label:'Clics',num:1},{label:'Costo',num:1},{label:'ROAS',num:1}], rows
    ));
  }

  // ── Google — Palabras clave ──
  if(on('google_keywords') && d.keywords && d.keywords.length){
    const rows = d.keywords.map(k => `<tr>
      <td>${esc(k.text)} <span class="fr-tag">${esc(k.match_type||'')}</span></td>
      <td class="num">${num(k.clicks)}</td>
      <td class="num">${num(k.conversions)}</td>
      <td class="num">${money(k.cost)}</td>
      <td class="num">${k.cpa!=null?money(k.cpa):'N/D'}</td>
    </tr>`).join('');
    html += sectionWrap('Google Ads — Palabras clave', table(
      [{label:'Keyword'},{label:'Clics',num:1},{label:'Conversiones',num:1},{label:'Costo',num:1},{label:'CPA',num:1}], rows
    ));
  }

  // ── Analytics — Canales de adquisición ──
  if(on('analytics_canales') && an && an.channels && an.channels.length){
    const rows = an.channels.map(c => `<tr>
      <td>${esc(c.channel)}</td>
      <td class="num">${num(c.sessions)}</td>
      <td class="num">${c.avg_engagement_seconds!=null?(c.avg_engagement_seconds/60).toFixed(1)+' min':'N/D'}</td>
      <td class="num">${c.conversion_rate!=null?pct(c.conversion_rate):'N/D'}</td>
    </tr>`).join('');
    html += sectionWrap('Analytics — Canales de adquisición', table(
      [{label:'Canal'},{label:'Sesiones',num:1},{label:'Interacción prom.',num:1},{label:'Tasa de conversión',num:1}], rows
    ));
  }

  // ── Analytics — Comportamiento del sitio + Top páginas ──
  if(on('analytics_sitio') && an && an.site_metrics){
    const sm = an.site_metrics;
    let secHtml = `<div class="fr-cards">
      ${card('Usuarios totales', num(sm.total_users))}
      ${card('Usuarios nuevos', num(sm.new_users))}
      ${card('Tiempo de interacción', sm.avg_engagement_seconds!=null?sm.avg_engagement_seconds+'s':'N/D')}
      ${card('Tasa de rebote', pct(sm.bounce_rate))}
    </div>`;
    if(an.top_pages && an.top_pages.length){
      const rows = an.top_pages.map(p => `<tr><td>${esc(p.path)}</td><td class="num">${num(p.views)}</td></tr>`).join('');
      secHtml += `<div style="margin-top:8px">${table([{label:'Página'},{label:'Vistas',num:1}], rows)}</div>`;
    }
    html += sectionWrap('Analytics — Comportamiento del sitio', secHtml);
  }

  // ── Analytics — Dispositivo y demografía ──
  if(on('analytics_dispositivo_demografia') && an && (an.devices?.length || an.demographics)){
    const DEVICE_LABELS = { mobile:'Celular', desktop:'Escritorio', tablet:'Tablet' };
    let secHtml = '';
    if(an.devices && an.devices.length){
      const rows = an.devices.map(dv => `<tr><td>${esc(DEVICE_LABELS[dv.device]||dv.device)}</td><td class="num">${num(dv.sessions)}</td><td class="num">${dv.conversion_rate!=null?pct(dv.conversion_rate):'N/D'}</td></tr>`).join('');
      secHtml += table([{label:'Dispositivo'},{label:'Sesiones',num:1},{label:'Conversión',num:1}], rows);
    }
    if(an.demographics?.age?.length){
      const rows = an.demographics.age.map(a => `<tr><td>${esc(a.bracket)}</td><td class="num">${num(a.users)}</td><td class="num">${a.conversion_rate!=null?pct(a.conversion_rate):'N/D'}</td></tr>`).join('');
      secHtml += `<div style="margin-top:8px">${table([{label:'Edad'},{label:'Usuarios',num:1},{label:'Conversión',num:1}], rows)}</div>`;
    }
    html += sectionWrap('Analytics — Dispositivo y demografía', secHtml);
  }

  // ── Analytics — Funnel eCommerce ──
  if(on('analytics_funnel_ecommerce') && an && an.funnel && an.funnel.length){
    const FUNNEL_LABELS = { view_item:'Vista de producto', add_to_cart:'Agregado al carrito', begin_checkout:'Checkout iniciado', add_shipping_info:'Datos de envío', add_payment_info:'Datos de pago', purchase:'Compra' };
    const rows = an.funnel.map(s => `<tr><td>${esc(FUNNEL_LABELS[s.event]||s.event)}</td><td class="num">${num(s.count)}</td><td class="num">${s.users_lost_pct!=null?pct(s.users_lost_pct):''}</td></tr>`).join('');
    html += sectionWrap('Analytics — Funnel eCommerce (GA4)', table([{label:'Paso'},{label:'Usuarios',num:1},{label:'Caída',num:1}], rows));
  }

  // ── Analytics — Productos (vistos / carrito / vendidos) ──
  if(on('analytics_productos') && an && an.top_items && an.top_items.length){
    const rows = an.top_items.map(p => `<tr><td>${esc(p.item)}</td><td class="num">${num(p.viewed)}</td><td class="num">${num(p.added_to_cart)}</td><td class="num">${num(p.purchased)}</td></tr>`).join('');
    html += sectionWrap('Analytics — Productos', table([{label:'Producto'},{label:'Vistos',num:1},{label:'Al carrito',num:1},{label:'Vendidos',num:1}], rows));
  }

  // ── Analytics — Eventos clave ──
  if(on('analytics_eventos_clave') && an && an.key_events && an.key_events.length){
    const rows = an.key_events.map(e => `<tr><td>${esc(e.event_name)}</td><td class="num">${num(e.key_events)}</td><td class="num">${e.conversion_rate!=null?pct(e.conversion_rate):'N/D'}</td></tr>`).join('');
    html += sectionWrap('Analytics — Eventos clave', table([{label:'Evento'},{label:'Conteo',num:1},{label:'Tasa de conversión',num:1}], rows));
  }

  // ── eCommerce — Resumen ──
  if(on('ecommerce_resumen') && ec){
    const ticket = ec.pedidos ? ec.facturacion/ec.pedidos : null;
    html += sectionWrap('eCommerce — Resumen (carga manual)', `<div class="fr-cards">
      ${card('Facturación', money(ec.facturacion))}
      ${card('Pedidos', num(ec.pedidos))}
      ${card('Ticket promedio', money(ticket))}
      ${card('Tasa de conversión', pct(ec.tasa_conversion_ecommerce))}
    </div>`);
  }

  body.innerHTML = html || `<div class="fr-empty">No hay secciones activas para este informe.</div>`;
}
