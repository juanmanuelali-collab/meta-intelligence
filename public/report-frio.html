<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informe de Datos — Docta Nexus</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f4;--surface:#ffffff;--ink:#15151a;--ink-soft:#54565f;--ink-faint:#93959e;
  --line:#e3e2dc;--sans:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;--serif:'Newsreader',Georgia,serif;
  --band:#132a5e;--band2:#7c3aed;--up:#0b804b;--down:#b91c1c;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}

#gate{position:fixed;inset:0;background:#0b0b0e;display:flex;align-items:center;justify-content:center;padding:1.5rem;z-index:50}
.gate-card{width:100%;max-width:400px;background:#1c1c22;border:1px solid #2c2c34;border-radius:14px;padding:2.4rem 2rem;text-align:center}
.gate-eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8f8fff;margin-bottom:.7rem}
.gate-title{font-size:1.4rem;font-weight:600;color:#f4f3ef;margin-bottom:.5rem}
.gate-sub{font-size:14px;color:#9a9aa4;margin-bottom:1.8rem;line-height:1.5}
.gate-input{width:100%;background:#131318;border:1px solid #33333c;border-radius:9px;color:#f4f3ef;font-family:var(--mono);font-size:19px;letter-spacing:.22em;text-align:center;padding:14px;outline:none;margin-bottom:.9rem}
.gate-btn{width:100%;background:#3d7fe0;color:#fff;border:none;border-radius:9px;font-size:16px;font-weight:600;padding:14px;cursor:pointer}
.gate-btn:disabled{opacity:.6}
.gate-err{color:#f0a5a5;font-size:13px;margin-top:.7rem;display:none}
.gate-expiry{margin-top:1.3rem;font-size:12px;color:#6a6a76}

#report{display:none;max-width:820px;margin:0 auto;padding:0 1.1rem 4rem}
#report.on{display:block}

.hdr{position:relative;padding:1.4rem 0;text-align:center;border-bottom:1px solid var(--line);margin-bottom:1.6rem}
.hdr-agency-logo{position:absolute;top:1.4rem;left:0;max-height:22px;max-width:76px;object-fit:contain;opacity:.75}
.hdr-client-logo{max-height:56px;max-width:180px;object-fit:contain;margin-bottom:12px}
.hdr-logo-empty{width:48px;height:48px;border-radius:10px;background:var(--surface);border:1px dashed var(--line);margin:0 auto 12px}
.hdr-title{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.2}
.hdr-sub{font-size:15px;color:var(--ink-soft);margin-top:4px}
.hdr-period{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:12.5px;color:var(--ink-faint);background:var(--surface);border-radius:20px;padding:5px 14px}
@media(min-width:640px){.hdr-agency-logo{max-height:26px;max-width:90px}}

.sec{margin-bottom:1.8rem}
.sec-band{background:var(--band);color:#fff;font-size:14px;font-weight:600;padding:11px 16px;border-radius:10px;margin-bottom:10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-band-premium{background:#0b0f1e;color:#fff;font-family:var(--serif);font-size:19px;font-weight:600;padding:16px 20px;border-radius:12px;margin-bottom:10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-band-premium .sec-band-sub{font-family:var(--sans);font-size:12.5px;font-weight:400;opacity:.7}
.sec-band-sub{font-size:11.5px;font-weight:400;opacity:.85}
.sec-band.alt{background:var(--band2)}
.sec-note{font-size:13px;color:var(--ink-faint);margin:-4px 0 10px;padding:0 2px}

.cards{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.cards.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.cards.g3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--surface);border-radius:12px;padding:16px}
.card-name{font-size:16px;font-weight:600;margin-bottom:10px}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.metric-lbl{font-size:12.5px;color:var(--ink-faint);margin-bottom:2px}
.metric-val{font-size:17px;font-family:var(--mono);font-weight:600}

.hero-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:640px){.hero-cards{grid-template-columns:repeat(5,minmax(0,1fr))}}
.hero-card{background:var(--surface);border-radius:12px;padding:16px;position:relative}
.hero-lbl{font-size:12.5px;color:var(--ink-soft);margin-bottom:6px}
.hero-val{font-family:var(--serif);font-size:26px;font-weight:600}
.hero-prev{font-size:11.5px;color:var(--ink-faint);margin-top:3px}
.hero-badge{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
.hero-badge.up{color:var(--up);background:#e7f5ec}
.hero-badge.down{color:var(--down);background:#fbe9e9}

.donut-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:640px){.donut-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.chpie-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:12px}
@media(min-width:640px){.chpie-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.sparkline{height:36px;margin-top:8px;position:relative}
.info-tip{position:relative;display:inline-block;cursor:help;font-size:11px;color:var(--ink-faint);border:1px solid var(--ink-faint);border-radius:50%;width:14px;height:14px;text-align:center;line-height:13px;margin-left:4px}
.info-tip:hover .info-tip-bubble{display:block}
.info-tip-bubble{display:none;position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;line-height:1.4;padding:8px 10px;border-radius:8px;width:180px;text-align:left;z-index:5;font-weight:400}
.stat-badge{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:20px;margin-left:6px}
.stat-badge.up{color:var(--up);background:#e7f5ec}
.stat-badge.down{color:var(--down);background:#fbe9e9}
.donut-card{background:var(--surface);border-radius:12px;padding:16px}
.donut-title{font-size:14px;color:var(--ink-soft);margin-bottom:10px}
.donut-row{display:flex;flex-direction:column;align-items:center;gap:14px}
.donut-wrap{position:relative;width:150px;height:150px;flex-shrink:0}
.donut-legend{display:flex;flex-direction:column;gap:7px;font-size:14px;width:100%}
.legend-item{display:flex;align-items:center;gap:7px;color:var(--ink-soft)}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

.bar-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.bar-row:last-child{border-bottom:none}
.bar-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{width:70px;height:7px;background:var(--bg);border-radius:4px;overflow:hidden;flex-shrink:0}
.bar-fill{height:100%;border-radius:4px}
.bar-val{font-family:var(--mono);font-size:13.5px;width:66px;text-align:right;flex-shrink:0}

.pill-row{display:flex;align-items:center;gap:12px;padding:7px 0}
.pill-name{width:120px;flex-shrink:0;font-size:13.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-track{flex:1;height:20px;background:var(--bg);border-radius:12px;overflow:hidden}
.pill-track-narrow{width:180px;height:20px;background:var(--bg);border-radius:12px;overflow:hidden;flex-shrink:0}
.pill-name-full{width:auto;max-width:none;flex:1;font-size:13.5px;color:var(--ink-soft);white-space:normal;word-break:break-word}
.pill-fill{height:100%;border-radius:12px;background:linear-gradient(90deg,#a78bfa,#6d28d9);min-width:8px}
.pill-val{font-size:13px;font-weight:700;color:var(--ink);font-family:var(--mono);flex-shrink:0;white-space:nowrap}

.footer-box{text-align:center;padding:1.6rem 1rem;font-size:13.5px;color:var(--ink-faint);border-top:1px solid var(--line);margin-top:2rem;white-space:pre-wrap;line-height:1.6}
.empty-note{font-size:14px;color:var(--ink-faint);padding:1rem;text-align:center}

.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut-center-pct{font-family:var(--serif);font-size:15px;font-weight:600;line-height:1}
.donut-center-lbl{font-size:8.5px;color:var(--ink-faint);margin-top:2px;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.data-table{width:100%;border-collapse:collapse;font-size:14px}
.data-table thead th{text-align:left;padding:9px 10px;font-weight:700;border-bottom:2px solid var(--ink);white-space:nowrap}
.data-table thead th:not(:first-child){text-align:right}
.data-table tbody td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.data-table tbody td.td-name{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.data-table tbody td:not(:first-child){text-align:right;font-family:var(--mono);font-size:13px}
.data-table tbody tr:last-child td{border-bottom:none}
.table-wrap{overflow-x:auto;background:var(--surface);border-radius:12px;padding:6px 14px}

.evo-card{background:var(--surface);border-radius:12px;padding:16px 16px 8px}
.evo-row{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.evo-stat-lbl{font-size:12.5px;color:var(--ink-soft)}
.evo-stat-val{font-family:var(--serif);font-size:22px;font-weight:600}

.supersec{margin:2.6rem 0 1.5rem;padding-bottom:.6rem;border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:12px}
.supersec:first-child{margin-top:0}
.supersec-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.supersec-title{font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.hdr-updated{margin-top:8px;font-size:11.5px;color:var(--ink-faint)}

.anchor-nav{display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin-bottom:1rem;border-bottom:1px solid var(--line)}
.anchor-link{flex-shrink:0;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--surface);border-radius:20px;padding:7px 13px;text-decoration:none;white-space:nowrap}
@media(min-width:900px){
  body{display:flex}
  #report{max-width:none;flex:1;min-width:0;padding-left:0}
  .anchor-nav{flex-direction:column;overflow-x:visible;position:sticky;top:1.5rem;align-self:flex-start;width:190px;flex-shrink:0;border-bottom:none;border-right:1px solid var(--line);padding:1.5rem 1rem 1.5rem 0;margin:0}
  .anchor-link{width:100%}
  .hdr, #body, .footer-box{max-width:820px;margin-left:auto;margin-right:auto;padding-left:1.1rem;padding-right:1.1rem}
}

.pdf-btn{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:8px 16px;cursor:pointer}

@media print{
  body{display:block !important;background:#fff !important}
  .anchor-nav, .pdf-btn, #gate{display:none !important}
  #report{max-width:none !important;padding:0 !important}
  .hdr, #body, .footer-box{max-width:none !important;padding:0 !important}
  .card, .hero-card, .donut-card, .table-wrap, .evo-card, .sec{break-inside:avoid;page-break-inside:avoid}
  .supersec{break-before:page;page-break-before:always}
  .supersec:first-child{break-before:auto;page-break-before:auto}
  a{text-decoration:none;color:inherit}
}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="gate-eyebrow">Docta Nexus — Informe de datos</div>
    <div class="gate-title" id="gateBizName">Informe de datos</div>
    <div class="gate-sub">Ingresá el código de acceso que te compartió tu agencia.</div>
    <input type="text" id="gateCode" class="gate-input" placeholder="000000" maxlength="6" inputmode="numeric">
    <button class="gate-btn" id="gateBtn" onclick="unlockReport()">Ver el informe</button>
    <div class="gate-err" id="gateErr"></div>
    <div class="gate-expiry" id="gateExpiry"></div>
  </div>
</div>

<nav class="anchor-nav" id="anchorNav" style="display:none"></nav>
<div id="report">
  <div class="hdr">
    <img class="hdr-agency-logo" id="hdrAgencyLogo" style="display:none">
    <div id="hdrClientLogoWrap"></div>
    <div class="hdr-title" id="hdrTitle"></div>
    <div class="hdr-sub" id="hdrBizName"></div>
    <div class="hdr-period" id="hdrPeriod"></div>
    <div class="hdr-updated" id="hdrUpdated"></div>
    <button class="pdf-btn" onclick="window.print()">📄 Descargar PDF</button>
  </div>
  <div id="body"></div>
  <div class="footer-box" id="footerBox" style="display:none"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script>Chart.register(ChartDataLabels); Chart.defaults.set('plugins.datalabels', { display: false });</script>
<script>
const token = location.pathname.split('/').filter(Boolean).pop();
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function money(v){ if(v==null||isNaN(v)) return 'N/D'; return '$'+Math.round(v).toLocaleString('es-AR'); }
function num(v){ if(v==null||isNaN(v)) return 'N/D'; return Math.round(v).toLocaleString('es-AR'); }
function pct(v){ if(v==null||isNaN(v)) return 'N/D'; return v.toFixed(2).replace('.',',')+'%'; }
function xf(v){ if(v==null||isNaN(v)) return 'N/D'; return v.toFixed(2).replace('.',',')+'x'; }
function fmtDate(iso){ if(!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'}); }

async function initGate(){
  try{
    const r = await fetch(`/api/report-frio/${token}/meta`);
    const d = await r.json();
    if(!r.ok){ gateError(d.error || 'Este informe no existe.'); return; }
    document.getElementById('gateBizName').textContent = d.business_name ? `Informe de ${d.business_name}` : 'Informe de datos';
    if(d.expired){
      gateError('Este link venció. Pedile a tu agencia que te comparta uno nuevo.');
      document.getElementById('gateExpiry').innerHTML = '';
      document.getElementById('gateCode').style.display = 'none';
      document.getElementById('gateBtn').style.display = 'none';
      return;
    }
    document.getElementById('gateExpiry').textContent = 'Este link expira el ' + fmtDate(d.expires_at);
  }catch(e){ gateError('No pudimos cargar el informe. Probá de nuevo en unos minutos.'); }
}
function gateError(msg){ const el = document.getElementById('gateErr'); el.textContent = msg; el.style.display = 'block'; }
initGate();

async function unlockReport(){
  const code = document.getElementById('gateCode').value.trim();
  const btn = document.getElementById('gateBtn');
  if(code.length < 4){ gateError('Ingresá el código completo.'); return; }
  btn.disabled = true; btn.textContent = 'Verificando…';
  try{
    const r = await fetch(`/api/report-frio/${token}/unlock`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ code }) });
    const d = await r.json();
    if(!r.ok){ gateError(d.error || 'Código incorrecto.'); btn.disabled=false; btn.textContent='Ver el informe'; return; }
    render(d);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('report').classList.add('on');
    document.getElementById('anchorNav').style.display = 'flex';
  }catch(e){ gateError('No pudimos verificar el código. Probá de nuevo.'); btn.disabled=false; btn.textContent='Ver el informe'; }
}
document.getElementById('gateCode').addEventListener('keydown', e => { if(e.key==='Enter') unlockReport(); });

let chartCounter = 0;
function nextChartId(){ return 'ch'+(chartCounter++); }
const CHART_COLORS = ['#2a78d6','#eb6834','#1baf7a','#eda100','#93959e'];

function heroArc(curr, prev, up){
  if(curr==null || prev==null || (curr+prev)===0) return '';
  const ratio = Math.max(0.03, Math.min(0.97, curr/(curr+prev)));
  const circumference = Math.PI * 40;
  const offset = circumference * (1 - ratio);
  const color = up ? '#0b804b' : '#e35d5d';
  return `<svg viewBox="0 0 100 56" style="width:92px;height:50px;display:block;margin:2px 0 4px">
    <path d="M10,50 A40,40 0 0 1 90,50" fill="none" stroke="#eceae2" stroke-width="9" stroke-linecap="round"/>
    <path d="M10,50 A40,40 0 0 1 90,50" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${circumference.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"/>
  </svg>`;
}
function heroCard(label, val, trendPct, prevVal, sparklineHtml, curr, prev){
  const up = trendPct==null || trendPct>=0;
  const arcHtml = (curr!=null && prev!=null) ? heroArc(curr, prev, up) : '';
  const trendTxt = trendPct!=null ? `<div style="font-size:13px;font-weight:700;color:${up?'#0b804b':'#e35d5d'};margin-bottom:6px">${up?'+':''}${trendPct.toFixed(1).replace('.',',')}%</div>` : '';
  return `<div class="hero-card"><div class="hero-lbl">${esc(label)}</div>${arcHtml}${trendTxt}<div class="hero-val">${val}</div>${sparklineHtml||''}${prevVal!=null?`<div class="hero-prev">Período anterior: ${prevVal}</div>`:''}</div>`;
}
function metric(label, val){ return `<div><div class="metric-lbl">${esc(label)}</div><div class="metric-val">${val}</div></div>`; }
function sectionOpen(title, alt, sub, premium){ return `<div class="sec"><div class="${premium?'sec-band-premium':'sec-band'+(alt?' alt':'')}">${esc(title)}${sub?`<span class="sec-band-sub">${esc(sub)}</span>`:''}</div>`; }
function sectionClose(){ return `</div>`; }
const SUPERSEC_ICONS = { 'Evolución':['📈','#bbf7d0','#14532d'], 'eCommerce':['🛒','#fde68a','#7c4a03'], 'Analytics':['📊','#c4b5fd','#4c1d95'], 'Meta Ads':['📣','#93c5fd','#1e3a8a'], 'Google Ads':['🔍','#fca5a5','#7f1d1d'], 'Search Console':['🔎','#5eead4','#134e4a'] };
const SUPERSEC_SLUGS = { 'Evolución':'evolucion', 'eCommerce':'ecommerce', 'Analytics':'analytics', 'Meta Ads':'meta', 'Google Ads':'google', 'Search Console':'searchconsole' };
let renderedSupersecs = [];
function superSection(key, displayTitle){
  renderedSupersecs.push(key);
  const [icon, bg, fg] = SUPERSEC_ICONS[key] || ['●','#f1f0e8','#2c2c2a'];
  return `<div class="supersec" id="sec-${SUPERSEC_SLUGS[key]||key}"><div class="supersec-icon" style="background:${bg};color:${fg}">${icon}</div><div class="supersec-title">${esc(displayTitle||key)}</div></div>`;
}
function statCard(label, val, changePct){
  const badge = changePct!=null ? `<span class="stat-badge ${changePct>=0?'up':'down'}">${changePct>=0?'▲':'▼'} ${Math.abs(changePct).toFixed(1).replace('.',',')}%</span>` : '';
  return `<div class="card"><div class="metric-lbl">${label}${badge}</div><div class="metric-val" style="font-size:19px">${val}</div></div>`;
}
function pctChange(curr, prev){ if(curr==null||prev==null||prev===0) return null; return +(((curr-prev)/prev)*100).toFixed(1); }
function fmtSeconds(s){ if(s==null) return 'N/D'; if(s<60) return Math.round(s)+'s'; return Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0'); }
const CHANNEL_DEFS = {
  'Direct': 'Llegó escribiendo la URL directo o desde un marcador — sin fuente de referencia detectada.',
  'Organic Search': 'Llegó desde un buscador (Google, Bing) sin pagar publicidad.',
  'Paid Search': 'Llegó desde un anuncio pago en buscadores (ej. Google Ads).',
  'Organic Social': 'Llegó desde una publicación orgánica en redes sociales, sin pauta paga.',
  'Paid Social': 'Llegó desde publicidad paga en redes sociales.',
  'Referral': 'Llegó haciendo clic en un link desde otro sitio web.',
  'Cross-network': 'Campañas que corren en varias redes/plataformas a la vez — GA4 no puede desglosar el origen exacto.',
  'Unassigned': 'Tráfico que GA4 no pudo clasificar en ninguna categoría conocida.',
  'Email': 'Llegó desde un link dentro de un email.',
  'Display': 'Llegó desde un banner o anuncio gráfico (display).',
  'Affiliates': 'Llegó a través de un programa de afiliados.',
  'Video': 'Llegó desde una plataforma de video.',
  'AI Assistant': 'Llegó a través de un asistente de IA (ej. ChatGPT) que citó o linkeó el sitio.',
  'SMS': 'Llegó desde un link enviado por SMS.',
  'Push Notifications': 'Llegó desde una notificación push.',
};
function pillRow(name, value, widthPct, tip){
  const tipHtml = tip ? `<span class="info-tip" style="flex-shrink:0">i<span class="info-tip-bubble">${esc(tip)}</span></span>` : '';
  return `<div class="pill-row">
    <span class="pill-name" title="${esc(name)}">${esc(name)}</span>
    ${tipHtml}
    <div class="pill-track"><div class="pill-fill" style="width:${Math.max(widthPct,6)}%"></div></div>
    <span class="pill-val">${value}</span>
  </div>`;
}
// Variante para Keywords — nombre completo sin cortar, barra angosta (a
// diferencia de pillRow, donde la prioridad es la barra ancha).
function pillRowKw(name, value, widthPct){
  return `<div class="pill-row">
    <span class="pill-name-full">${esc(name)}</span>
    <div class="pill-track-narrow"><div class="pill-fill" style="width:${Math.max(widthPct,10)}%"></div></div>
    <span class="pill-val">${value}</span>
  </div>`;
}
function sparkline(rows, field, color){
  if(!rows || !rows.length) return '';
  const id = nextChartId();
  setTimeout(()=>new Chart(document.getElementById(id), {
    type:'line',
    data:{ labels: rows.map((_,i)=>i), datasets:[{ data: rows.map(r=>r[field]), borderColor:color, backgroundColor:'transparent', pointRadius:0, borderWidth:1.5, tension:.35 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false}, tooltip:{enabled:false} }, scales:{ x:{ display:false }, y:{ display:false } } }
  }),0);
  return `<div class="sparkline"><canvas id="${id}"></canvas></div>`;
}
function dataTable(cols, rows){
  return `<div class="table-wrap"><table class="data-table"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr><td class="td-name">${r[0]}</td>${r.slice(1).map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function render(d){
  renderedSupersecs = [];
  if(d.color_primary) document.documentElement.style.setProperty('--band', d.color_primary);
  document.getElementById('hdrBizName').textContent = d.business_name || '';
  document.getElementById('hdrTitle').textContent = d.report_title || 'Informe de datos';
  document.getElementById('hdrPeriod').textContent = d.period_label || '';
  if(d.data_retrieved_at){
    const dt = new Date(d.data_retrieved_at);
    document.getElementById('hdrUpdated').textContent = 'Datos actualizados el ' + dt.toLocaleDateString('es-AR',{day:'2-digit',month:'long'}) + ' a las ' + dt.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  }

  if(d.agency_logo_url){
    const al = document.getElementById('hdrAgencyLogo');
    al.src = d.agency_logo_url; al.alt = 'Docta Nexus'; al.style.display = 'block';
  }
  document.getElementById('hdrClientLogoWrap').innerHTML = d.client_logo_url
    ? `<img class="hdr-client-logo" src="${esc(d.client_logo_url)}" alt="${esc(d.business_name||'')}">`
    : `<div class="hdr-logo-empty"></div>`;

  const an = d.analytics;
  const m = d.meta, g = d.google;
  const on = k => d.anchors ? d.anchors[k] !== false : true;
  let html = '';

  // ── Evolución — Vistas y Usuarios día por día. Va primero de todo. ──
  const DIAS_ES = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const DIAS_ES_LARGO = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  if(an && an.daily_series && an.daily_series.length){
    const ds = an.daily_series;
    const totalViews = ds.reduce((s,r)=>s+r.views,0);
    const totalUsers = ds.reduce((s,r)=>s+r.users,0);
    const chartId = nextChartId();
    const parseYmd = s => new Date(Date.UTC(+s.slice(0,4), +s.slice(4,6)-1, +s.slice(6,8)));
    html += superSection('Evolución', 'Páginas Vistas y Usuarios: Evolución Mensual y Anual');
    html += `<div class="evo-card">
      <div style="font-weight:600;font-size:14.5px;margin-bottom:10px">Vistas y Usuarios Mensuales · ${esc(d.period_label||'')}</div>
      <div class="evo-row">
        <div><div class="evo-stat-lbl">Vistas totales</div><div class="evo-stat-val">${num(totalViews)}</div></div>
        <div><div class="evo-stat-lbl">Usuarios totales</div><div class="evo-stat-val">${num(totalUsers)}</div></div>
      </div>
      <div style="height:290px"><canvas id="${chartId}" role="img" aria-label="Evolución diaria de vistas y usuarios"></canvas></div>
    </div>`;
    setTimeout(()=>{
      const fmtLbl = s => s.length===8 ? `${DIAS_ES_LARGO[parseYmd(s).getUTCDay()]} ${s.slice(6,8)}/${s.slice(4,6)}` : s;
      const fmtLblFull = s => s.length===8 ? `${DIAS_ES[parseYmd(s).getUTCDay()]} ${s.slice(6,8)}/${s.slice(4,6)}` : s;
      const top5Idx = ds.map((r,i)=>({i, v:r.views})).sort((a,b)=>b.v-a.v).slice(0,5).map(x=>x.i);
      new Chart(document.getElementById(chartId), {
        type: 'line',
        data: {
          labels: ds.map(r=>fmtLbl(r.date)),
          datasets: [
            { label:'Vistas', data: ds.map(r=>r.views), borderColor:'#6d28d9', backgroundColor:'rgba(109,40,217,.14)', fill:true, tension:.35, borderWidth:2,
              pointRadius: ctx => top5Idx.includes(ctx.dataIndex) ? 4 : 0,
              pointBackgroundColor: '#6d28d9', pointBorderColor: '#fff', pointBorderWidth: 1.5,
              datalabels:{ display:false } },
            { label:'Usuarios', data: ds.map(r=>r.users), borderColor:'#2a78d6', backgroundColor:'rgba(42,120,214,.10)', fill:true, tension:.35, pointRadius:0, borderWidth:2, datalabels:{ display:false } },
          ],
        },
        options: {
          responsive:true, maintainAspectRatio:false,
          layout:{ padding:{ top:10 } },
          plugins:{
            legend:{ position:'top', align:'end', labels:{ boxWidth:8, boxHeight:8, usePointStyle:true, font:{ size:11 } } },
            tooltip:{ callbacks:{ title: items => fmtLblFull(ds[items[0].dataIndex].date) } },
            datalabels:{ display:false },
          },
          scales:{ x:{ grid:{ display:false }, ticks:{ font:{ size:8.5 }, maxRotation:90, minRotation:90, autoSkip:false } }, y:{ grid:{ color:'#e3e2dc' }, ticks:{ font:{ size:10 } } } },
        }
      });
    },0);
  }

  // ── Evolución Tráfico — Sesiones día por día ──
  if(an && an.daily_series && an.daily_series.length){
    const ds = an.daily_series;
    const totalSessions = ds.reduce((s,r)=>s+(r.sessions||0),0);
    const chartId3 = nextChartId();
    const parseYmd2 = s => new Date(Date.UTC(+s.slice(0,4), +s.slice(4,6)-1, +s.slice(6,8)));
    html += `<div class="evo-card" style="margin-top:12px">
      <div style="font-weight:600;font-size:14.5px;margin-bottom:2px">Sesiones Mensuales${d.business_url?` · ${esc(d.business_url.replace(/^https?:\/\//,''))}`:''}</div>
      <div style="font-size:12px;color:var(--ink-faint);margin-bottom:10px">${esc(d.period_label||'')}</div>
      <div class="evo-row"><div><div class="evo-stat-lbl">Sesiones totales</div><div class="evo-stat-val">${num(totalSessions)}</div></div></div>
      <div style="height:270px"><canvas id="${chartId3}" role="img" aria-label="Evolución diaria de sesiones"></canvas></div>
    </div>`;
    setTimeout(()=>{
      const fmtLbl3 = s => s.length===8 ? `${DIAS_ES_LARGO[parseYmd2(s).getUTCDay()]} ${s.slice(6,8)}/${s.slice(4,6)}` : s;
      const fmtLblFull3 = s => s.length===8 ? `${DIAS_ES[parseYmd2(s).getUTCDay()]} ${s.slice(6,8)}/${s.slice(4,6)}` : s;
      const top5Idx3 = ds.map((r,i)=>({i, v:r.sessions||0})).sort((a,b)=>b.v-a.v).slice(0,5).map(x=>x.i);
      new Chart(document.getElementById(chartId3), {
        type: 'line',
        data: { labels: ds.map(r=>fmtLbl3(r.date)), datasets: [{ label:'Sesiones', data: ds.map(r=>r.sessions||0), borderColor:'#eb6834', backgroundColor:'rgba(235,104,52,.12)', fill:true, tension:.35, borderWidth:2,
          pointRadius: ctx => top5Idx3.includes(ctx.dataIndex) ? 4 : 0, pointBackgroundColor:'#eb6834', pointBorderColor:'#fff', pointBorderWidth:1.5 }] },
        options: {
          responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ title: items => fmtLblFull3(ds[items[0].dataIndex].date) } } },
          scales:{ x:{ grid:{ display:false }, ticks:{ font:{ size:8.5 }, maxRotation:90, minRotation:90, autoSkip:false } }, y:{ grid:{ color:'#e3e2dc' }, ticks:{ font:{ size:10 } } } },
        }
      });
    },0);
  }

  // ── Evolución Anual — Usuarios mes a mes, siempre últimos 12 meses,
  // independiente del período elegido en el informe. ──
  const MESES_CORTOS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  if(an && an.annual_users_by_month && an.annual_users_by_month.length){
    const au = an.annual_users_by_month;
    const chartId2 = nextChartId();
    html += `<div class="evo-card" style="margin-top:12px">
      <div style="font-weight:600;font-size:14.5px;margin-bottom:10px">Evolución Anual — Usuarios · últimos 12 meses</div>
      <div style="height:210px"><canvas id="${chartId2}" role="img" aria-label="Evolución anual de usuarios"></canvas></div>
    </div>`;
    setTimeout(()=>{
      const fmtMonth = ym => ym.length===6 ? `${MESES_CORTOS[+ym.slice(4,6)-1]} '${ym.slice(2,4)}` : ym;
      new Chart(document.getElementById(chartId2), {
        type: 'line',
        data: {
          labels: au.map(r=>fmtMonth(r.month)),
          datasets: [{ label:'Usuarios', data: au.map(r=>r.users), borderColor:'#2a78d6', backgroundColor:'rgba(42,120,214,.12)', fill:true, tension:.35, pointRadius:3, borderWidth:2,
            datalabels:{ display:true, anchor:'end', align:'top', offset:6, color:'#2a78d6', font:{ size:10.5, weight:'bold' }, formatter: v => num(v) } }],
        },
        options: { responsive:true, maintainAspectRatio:false, layout:{ padding:{ top:20 } }, plugins:{ legend:{ display:false } }, scales:{ x:{ grid:{ display:false }, ticks:{ font:{ size:10 } } }, y:{ grid:{ color:'#e3e2dc' }, ticks:{ font:{ size:10 } } } } }
      });
    },0);
  }

  if(on('ecommerce_resumen') && d.ecommerce){
    const eco = d.ecommerce;
    const inversionMeta = eco.inversion_meta_manual ?? eco.inversion_meta_auto ?? 0;
    const inversionGoogle = eco.inversion_google_manual ?? eco.inversion_google_auto ?? 0;
    const ventaMeta = eco.venta_meta_manual ?? eco.venta_meta_auto ?? 0;
    const ventaGoogle = eco.venta_google_manual ?? eco.venta_google_auto ?? 0;
    const inversionTotal = Number(inversionMeta) + Number(inversionGoogle);
    const ventaTotal = Number(ventaMeta) + Number(ventaGoogle);
    html += superSection('eCommerce');
    html += sectionOpen('Resultados generales eCommerce');
    html += `<div class="cards g3">` + [
      statCard('Facturación', money(eco.facturacion)),
      statCard('Pedidos', num(eco.pedidos)),
      statCard('Tasa de conversión', pct(eco.tasa_conversion_ecommerce)),
      statCard('ROAS general', inversionTotal>0?xf(ventaTotal/inversionTotal):'N/D'),
    ].join('') + `</div>`;
    html += sectionClose();
  }

  if(an) html += superSection('Analytics');
  if(on('analytics_sitio') && an && an.top_site){
    const ts = an.top_site.current, prev = an.top_site.previous, ch = an.top_site.change || {};
    const fmtTime = s => s!=null ? Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0') : 'N/D';
    html += sectionOpen('Analytics — Resumen del sitio', false, d.period_label);
    html += `<div class="hero-cards">` +
      heroCard('Vistas', num(ts.views), ch.views, prev?num(prev.views):null, sparkline(an.daily_series,'views','#6d28d9'), ts.views, prev?.views) +
      heroCard('Total de usuarios', num(ts.total_users), ch.total_users, prev?num(prev.total_users):null, sparkline(an.daily_series,'users','#2a78d6'), ts.total_users, prev?.total_users) +
      heroCard('Usuarios nuevos', num(ts.new_users), ch.new_users, prev?num(prev.new_users):null, sparkline(an.daily_series,'new_users','#1baf7a'), ts.new_users, prev?.new_users) +
      heroCard('Tiempo medio', fmtTime(ts.avg_engagement_seconds), ch.avg_engagement_seconds, prev?fmtTime(prev.avg_engagement_seconds):null, sparkline(an.daily_series,'avg_engagement_seconds','#eda100'), ts.avg_engagement_seconds, prev?.avg_engagement_seconds) +
      heroCard('% de rebote', pct(ts.bounce_rate), ch.bounce_rate!=null?-ch.bounce_rate:null, prev?pct(prev.bounce_rate):null, sparkline(an.daily_series,'bounce_rate','#e35d5d'), ts.bounce_rate, prev?.bounce_rate)
      + `</div>`;
    html += sectionClose();
  }

  if(on('analytics_sitio') && an && an.top_pages && an.top_pages.length){
    const maxViews = Math.max(...an.top_pages.map(p=>p.views||p.pageviews||0), 1);
    html += sectionOpen('Analytics — Páginas más vistas' + (d.business_url?` · ${d.business_url.replace(/^https?:\/\//,'')}`:''), true);
    html += `<div class="card">` + an.top_pages.slice(0,10).map(p => pillRow(p.page||p.path||p.title, num(p.views||p.pageviews), (p.views||p.pageviews||0)/maxViews*100)).join('') + `</div>`;
    html += sectionClose();
  }

  if(on('analytics_dispositivo_demografia') && an && (an.devices?.length || an.browsers?.length || an.operating_systems?.length)){
    html += sectionOpen('Analytics — Dispositivo, navegador y sistema operativo');
    html += `<div class="donut-grid">`;
    const donut = (title, rows, keyField) => {
      if(!rows || !rows.length) return '';
      const total = rows.reduce((s,r)=>s+(r.sessions||0),0) || 1;
      const topPct = Math.round((rows[0].sessions||0)/total*100);
      const id = nextChartId();
      setTimeout(()=>new Chart(document.getElementById(id), {
        type:'doughnut',
        data:{ datasets:[{ data: rows.slice(0,5).map(r=>r.sessions), backgroundColor: CHART_COLORS, borderWidth:2, borderColor:'#fff' }] },
        options:{ responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{ legend:{display:false} } }
      }),0);
      return `<div class="donut-card"><div class="donut-title">${esc(title)}</div><div class="donut-row">
        <div class="donut-wrap"><canvas id="${id}" role="img" aria-label="${esc(title)}"></canvas>
          <div class="donut-center"><div class="donut-center-pct">${topPct}%</div><div class="donut-center-lbl">${esc(rows[0][keyField])}</div></div>
        </div>
        <div class="donut-legend">${rows.slice(0,5).map((r,i)=>`<div class="legend-item"><span class="legend-dot" style="background:${CHART_COLORS[i]}"></span>${esc(r[keyField])} · ${Math.round((r.sessions||0)/total*100)}%</div>`).join('')}</div>
      </div></div>`;
    };
    html += donut('Dispositivo', an.devices, 'device');
    html += donut('Navegador', an.browsers, 'browser');
    html += donut('Sistema operativo', an.operating_systems, 'os');
    html += `</div>`;
    html += sectionClose();
  }

  if(on('analytics_dispositivo_demografia') && an && ((an.demographics?.age?.length) || (an.demographics?.gender?.length) || an.cities?.length)){
    const GENDER_ES = { male:'Hombres', female:'Mujeres' };
    const demoCard = (title, rows, labelFn, valField) => {
      if(!rows || !rows.length) return '';
      const sorted = [...rows].sort((a,b)=>b[valField]-a[valField]).slice(0,8);
      const max = Math.max(...sorted.map(r=>r[valField]||0), 1);
      return `<div class="card"><div class="donut-title" style="font-weight:700;font-size:14px;color:var(--ink)">${esc(title)}</div>` +
        sorted.map(r => pillRow(labelFn(r), num(r[valField]), (r[valField]||0)/max*100)).join('') + `</div>`;
    };
    html += sectionOpen('Analytics — Usuarios por Edad, Sexo y Ciudad', true);
    html += `<div class="chpie-grid">` +
      demoCard('Usuarios por Edad', an.demographics?.age, r=>r.bracket, 'users') +
      demoCard('Usuarios por Sexo', an.demographics?.gender, r=>GENDER_ES[r.gender]||r.gender, 'users') +
      `</div>`;
    if(an.cities?.length) html += demoCard('Usuarios por Ciudad', an.cities, r=>r.city, 'users');
    html += sectionClose();
  }

  if(on('analytics_canales') && an && an.channels_by_users && an.channels_by_users.length){
    const maxUsers = Math.max(...an.channels_by_users.map(c=>c.users||0), 1);
    html += sectionOpen('Analytics — Canales de tráfico', false, d.period_label);
    html += `<div class="card"><div style="font-weight:700;font-size:15px;color:var(--ink);margin-bottom:12px">Canales de Adquisición de Usuarios</div>` +
      an.channels_by_users.map(c => pillRow(c.channel, num(c.users)+(c.avg_engagement_seconds?' · '+fmtSeconds(c.avg_engagement_seconds):''), (c.users||0)/maxUsers*100, CHANNEL_DEFS[c.channel])).join('') + `</div>`;

    const channelPie = (title, sub, rows) => {
      if(!rows || !rows.length) return '';
      const id = nextChartId();
      setTimeout(()=>new Chart(document.getElementById(id), {
        type:'pie',
        data:{ labels: rows.slice(0,8).map(r=>r.channel), datasets:[{ data: rows.slice(0,8).map(r=>r.users), backgroundColor: CHART_COLORS.concat(['#c4b5fd','#fca5a5','#6ee7b7']), borderWidth:2, borderColor:'#fff' }] },
        options:{
          responsive:true, maintainAspectRatio:false,
          plugins:{
            legend:{ position:'bottom', labels:{ boxWidth:9, boxHeight:9, font:{ size:11 } } },
            datalabels:{ display:true, color:'#fff', font:{ size:11, weight:'bold' }, formatter:(v,ctx)=>{ const total=ctx.chart.data.datasets[0].data.reduce((a,b)=>a+b,0); const p=total?Math.round(v/total*100):0; return p>=6?p+'%':''; } },
          },
        }
      }),0);
      return `<div class="card"><div class="donut-title" style="font-weight:700;font-size:15px;color:var(--ink)">${esc(title)}${sub?` <span style="font-weight:400;font-size:12px;color:var(--ink-faint)">· ${esc(sub)}</span>`:''}</div><div style="height:220px"><canvas id="${id}"></canvas></div></div>`;
    };
    html += `<div class="chpie-grid">` +
      channelPie('Distribución de Tráfico según Canales', d.period_label, an.channels_by_users) +
      channelPie('Distribución de Tráfico según Canales Anual', 'últimos 12 meses', an.annual_channels) +
      `</div>`;
    html += sectionClose();
  }

  if(on('analytics_eventos_clave') && an && an.key_events && an.key_events.length){
    const prevEventsMap = {};
    (an.key_events_previous||[]).forEach(e => { prevEventsMap[e.event_name] = e.count; });
    html += sectionOpen('Analytics — Eventos clave', true, d.period_label);
    html += `<div class="card">` + an.key_events.slice(0,10).map(e => {
      const change = prevEventsMap[e.event_name]!=null ? pctChange(e.count, prevEventsMap[e.event_name]) : null;
      const changeHtml = change!=null ? `<span class="stat-badge ${change>=0?'up':'down'}" style="margin-left:8px">${change>=0?'▲':'▼'} ${Math.abs(change).toFixed(1).replace('.',',')}%</span>` : '';
      return `<div class="bar-row" style="justify-content:space-between">
      <span class="bar-name" style="flex:none">${esc(e.event_name)}</span>
      <span class="bar-val" style="width:auto">${num(e.count)}${e.conversion_rate!=null?' · '+pct(e.conversion_rate):''}${changeHtml}</span>
    </div>`;
    }).join('') + `</div>`;
    html += sectionClose();
  }

  if(m) html += superSection('Meta Ads');
  const metaLeads = (d.meta_campaigns||[]).filter(c=>c.segment==='leads');
  const metaEcom = (d.meta_campaigns||[]).filter(c=>c.segment==='ecommerce');
  if(on('meta_campanas_leads') && metaLeads.length){
    html += sectionOpen('Meta Ads — Resumen de campañas', false, d.period_label, true);
    html += dataTable(
      ['Campaña','Inversión','Mensajes','Impresiones','CTR','Clics','C. resultado'],
      metaLeads.map(c => [
        `<span title="${esc(c.name)}">${esc(c.name)}</span>`, money(c.spend), num(c.messagingConn), num(c.impressions),
        pct(c.impressions?c.clicks/c.impressions*100:null), num(c.clicks),
        money(c.messagingConn?c.spend/c.messagingConn:null),
      ])
    );
    html += sectionClose();
  }
  if(on('meta_campanas_ecommerce') && metaEcom.length){
    html += sectionOpen('Meta Ads — Resumen de campañas eCommerce', false, d.period_label, true);
    html += dataTable(
      ['Campaña','Inversión','Compras','ROAS','Impresiones','CTR','Clics','C. resultado'],
      metaEcom.map(c => [
        `<span title="${esc(c.name)}">${esc(c.name)}</span>`, money(c.spend), num(c.purchases), xf(c.spend?c.revenue/c.spend:null), num(c.impressions),
        pct(c.impressions?c.clicks/c.impressions*100:null), num(c.clicks),
        money(c.purchases?c.spend/c.purchases:null),
      ])
    );
    html += sectionClose();
  }

  if(on('meta_rendimiento') && m){
    const mp = m.previous;
    const prevCpm = mp && mp.impressions>0 ? mp.spend/mp.impressions*1000 : null;
    const prevCpc = mp && mp.clicks>0 ? mp.spend/mp.clicks : null;
    html += sectionOpen('Meta Ads — Rendimiento', false, d.period_label);
    html += `<div class="cards g3">` + [
      statCard('Resultados', num(m.purchases||m.messagingConn), mp?pctChange(m.purchases||m.messagingConn, mp.conversions||mp.messages):null),
      statCard('Costo por resultado', money(m.cpa||m.cpmsg), mp?pctChange(m.cpa||m.cpmsg, mp.cpa||mp.cpmsg):null),
      statCard('Importe gastado', money(m.spend), mp?pctChange(m.spend, mp.spend):null),
      statCard('Impresiones', num(m.impressions), mp?pctChange(m.impressions, mp.impressions):null),
      statCard('Alcance', num(m.reach), mp?pctChange(m.reach, mp.reach):null),
      statCard('CPM', money(m.cpm), pctChange(m.cpm, prevCpm)),
      statCard('CPC', money(m.clicks?m.spend/m.clicks:null), pctChange(m.clicks?m.spend/m.clicks:null, prevCpc)),
      statCard('Clics', num(m.clicks), mp?pctChange(m.clicks, mp.clicks):null),
      statCard('Frecuencia', m.frequency!=null?m.frequency.toFixed(2).replace('.',','):'N/D', mp?pctChange(m.frequency, mp.frequency):null),
      statCard('Mensajes', num(m.messagingConn), mp?pctChange(m.messagingConn, mp.messages):null),
      statCard('Mensajes Depth 3 (conversiones activa)', num(m.messagingConn), mp?pctChange(m.messagingConn, mp.messages):null),
    ].join('') + `</div>`;
    html += sectionClose();
  }

  if(on('meta_rendimiento') && m && m.ecommerce && m.ecommerce.purchases){
    const me = m.ecommerce;
    html += sectionOpen('Meta Ads — Rendimiento eCommerce', true, d.period_label);
    html += `<div class="cards g3">` + [
      statCard('Resultados', num(me.purchases)), statCard('Costo por resultado', money(me.purchases?me.spend/me.purchases:null)),
      statCard('Importe gastado', money(me.spend)), statCard('Compras', num(me.purchases)), statCard('ROAS', xf(me.spend?me.revenue/me.spend:null)),
    ].join('') + `</div>`;
    html += sectionClose();
  }

  const FUNNEL_LABELS = { view_item:'Vio el producto', add_to_cart:'Agregó al carrito', begin_checkout:'Inició checkout', add_shipping_info:'Cargó envío', add_payment_info:'Cargó pago', purchase:'Compró' };
  const FUNNEL_ORDER = ['view_item','add_to_cart','begin_checkout','add_shipping_info','add_payment_info','purchase'];
  if(on('meta_funnel') && an && an.funnel && FUNNEL_ORDER.some(k=>an.funnel[k]?.count)){
    html += sectionOpen('Funnel de Conversión Meta');
    html += `<div class="cards">` + FUNNEL_ORDER.filter(k=>an.funnel[k]).map(k => `<div class="card"><div class="metrics" style="grid-template-columns:1fr auto">
      <div class="card-name" style="margin:0">${esc(FUNNEL_LABELS[k]||k)}</div><div class="metric-val">${num(an.funnel[k].count)}</div>
    </div></div>`).join('') + `</div>`;
    html += sectionClose();
  }

  if(on('meta_mensajeria') && m && m.messagingConn){
    const mp = m.previous;
    const msgChange = mp?pctChange(m.messagingConn, mp.messages):null;
    const depthTip = `<span class="info-tip">i<span class="info-tip-bubble">Hoy es el mismo total de conexiones de mensajes — Meta no expone un desglose de profundidad de conversación separado por API.</span></span>`;
    html += sectionOpen('Meta Ads — Mensajería y leads nativos', false, d.period_label);
    html += `<div class="cards g3">` + [
      statCard('Conexiones de mensajes', num(m.messagingConn), msgChange), statCard('Costo por mensaje', money(m.cpmsg), mp?pctChange(m.cpmsg, mp.cpmsg):null),
      statCard('Depth 2'+depthTip, num(m.messagingConn), msgChange), statCard('Depth 3'+depthTip, num(m.messagingConn), msgChange), statCard('Depth 5'+depthTip, num(m.messagingConn), msgChange),
    ].join('') + `</div>`;
    html += sectionClose();
  }

  if(on('meta_engagement') && m){
    html += sectionOpen('Meta Ads — Engagement social');
    html += `<div class="cards g3">` + [
      statCard('Reacciones', num(m.postReactions)), statCard('Comentarios', num(m.postComments)),
      statCard('Compartidos', num(m.postShares)), statCard('Guardados', num(m.postSaves)),
    ].join('') + `</div>`;
    html += sectionClose();
  }

  if(on('meta_video') && m && m.hasVideoActivity){
    html += sectionOpen('Meta Ads — Video');
    html += `<div class="cards g3">` + [
      statCard('Reproducciones', num(m.videoViews)), statCard('ThruPlays', num(m.thruPlays)), statCard('% Completado prom.', pct(m.videoAvgWatchPct)),
    ].join('') + `</div>`;
    html += sectionClose();
  }

  if(g) html += superSection('Google Ads');
  if(on('google_rendimiento') && g){
    const gp = g.previous;
    html += sectionOpen('Google Ads — Rendimiento', false, d.period_label);
    html += `<div class="cards g3">` + [
      statCard('Inversión', money(g.spend), gp?pctChange(g.spend, gp.spend):null),
      statCard('Conversiones', num(g.conversions), gp?pctChange(g.conversions, gp.conversions):null),
      statCard('CPA', money(g.conversions?g.spend/g.conversions:null), gp?pctChange(g.conversions?g.spend/g.conversions:null, gp.cpa):null),
      statCard('Impresiones', num(g.impressions), gp?pctChange(g.impressions, gp.impressions):null),
      statCard('CTR', pct(g.impressions?g.clicks/g.impressions*100:null), gp?pctChange(g.impressions?g.clicks/g.impressions*100:null, gp.ctr):null),
      statCard('Clics', num(g.clicks), gp?pctChange(g.clicks, gp.clicks):null),
    ].join('') + `</div>`;
    if(d.google_objetivos && d.google_objetivos.length){
      html += `<div class="card" style="margin-top:10px"><div class="card-name">Objetivos principales</div>` +
        d.google_objetivos.slice(0,5).map(o=>`<div class="bar-row"><span class="bar-name">${esc(o.name)}</span><span class="bar-val">${num(o.conversions)}</span></div>`).join('') + `</div>`;
    }
    html += sectionClose();
  }

  const googleEcomAgg = (d.google_campaigns||[]).filter(c=>c.segment==='ecommerce').reduce((a,c)=>({spend:a.spend+(c.spend||0),conversions:a.conversions+(c.conversions||0),conversion_value:a.conversion_value+(c.conversion_value||0),impressions:a.impressions+(c.impressions||0),clicks:a.clicks+(c.clicks||0)}),{spend:0,conversions:0,conversion_value:0,impressions:0,clicks:0});
  if(on('google_rendimiento') && googleEcomAgg.spend > 0){
    html += sectionOpen('Google Ads — Rendimiento eCommerce', true, d.period_label);
    html += `<div class="cards g3">` + [
      statCard('Inversión', money(googleEcomAgg.spend)), statCard('Conversiones', num(googleEcomAgg.conversions)), statCard('Valor de conversión', money(googleEcomAgg.conversion_value)),
      statCard('CPA', money(googleEcomAgg.conversions?googleEcomAgg.spend/googleEcomAgg.conversions:null)), statCard('Impresiones', num(googleEcomAgg.impressions)),
      statCard('CTR', pct(googleEcomAgg.impressions?googleEcomAgg.clicks/googleEcomAgg.impressions*100:null)), statCard('Clics', num(googleEcomAgg.clicks)),
      statCard('ROAS', xf(googleEcomAgg.spend?googleEcomAgg.conversion_value/googleEcomAgg.spend:null)),
    ].join('') + `</div>`;
    html += sectionClose();
  }

  if(on('google_impression_share') && g && g.searchImpressionShare != null){
    html += sectionOpen('Google Ads — Cuota de impresión de búsqueda');
    html += `<div class="cards g3">` + [
      statCard('Cuota de impresión', pct(g.searchImpressionShare)), statCard('Perdida por presupuesto', pct(g.searchLostBudget)), statCard('Perdida por ranking', pct(g.searchLostRank)),
    ].join('') + `</div>`;
    html += sectionClose();
  }

  const googleLeads = (d.google_campaigns||[]).filter(c=>c.segment==='leads');
  const googleEcomList = (d.google_campaigns||[]).filter(c=>c.segment==='ecommerce');
  if(on('google_campanas_leads') && googleLeads.length){
    html += sectionOpen('Google Ads — Resumen de campañas', false, d.period_label, true);
    html += dataTable(
      ['Campaña','Inversión','Conversiones','CPA','Impresiones','CTR','Clics'],
      googleLeads.map(c => [
        `<span title="${esc(c.campaign_name)}">${esc(c.campaign_name)}</span>`, money(c.spend), num(c.conversions), money(c.conversions?c.spend/c.conversions:null),
        num(c.impressions), pct(c.impressions?c.clicks/c.impressions*100:null), num(c.clicks),
      ])
    );
    html += sectionClose();
  }
  if(on('google_campanas_ecommerce') && googleEcomList.length){
    html += sectionOpen('Google Ads — Resumen de campañas eCommerce', false, d.period_label, true);
    html += dataTable(
      ['Campaña','Conversiones','Valor conversión','CPA','Impresiones','CTR','Clics','ROAS'],
      googleEcomList.map(c => [
        `<span title="${esc(c.campaign_name)}">${esc(c.campaign_name)}</span>`, num(c.conversions), money(c.conversion_value), money(c.conversions?c.spend/c.conversions:null),
        num(c.impressions), pct(c.impressions?c.clicks/c.impressions*100:null), num(c.clicks), xf(c.spend?c.conversion_value/c.spend:null),
      ])
    );
    html += sectionClose();
  }

  if(on('google_keywords') && d.keywords && d.keywords.length){
    const maxClicks = Math.max(...d.keywords.map(k=>k.clicks||0), 1);
    html += sectionOpen('Google Ads — Palabras clave', false, d.period_label);
    html += `<div class="card">` + d.keywords.slice(0,15).map(k => pillRowKw(k.text, num(k.clicks)+' clics', (k.clicks||0)/maxClicks*100)).join('') + `</div>`;
    html += sectionClose();
  }

  if(d.search_console) html += superSection('Search Console', 'Search Console — Cómo te encuentran de manera orgánica en Google');
  if(on('search_console_resumen') && d.search_console){
    const sc = d.search_console;
    const scp = sc.previous;
    html += sectionOpen('Search Console: Indexación en Google · Tráfico Orgánico', false, d.period_label);
    html += `<div class="cards g3">` + [
      statCard('Clics', num(sc.clicks), scp?pctChange(sc.clicks, scp.clicks):null),
      statCard('Impresiones', num(sc.impressions), scp?pctChange(sc.impressions, scp.impressions):null),
      statCard('CTR', pct(sc.ctr), scp?pctChange(sc.ctr, scp.ctr):null),
      statCard('Posición promedio', sc.position!=null?sc.position.toFixed(1).replace('.',','):'N/D', scp && pctChange(sc.position, scp.position)!=null ? -pctChange(sc.position, scp.position) : null),
    ].join('') + `</div>`;
    html += sectionClose();
  }

  if(on('search_console_resumen') && d.search_console_queries && d.search_console_queries.length){
    const maxQClicks = Math.max(...d.search_console_queries.map(q=>q.clicks||0), 1);
    html += sectionOpen('Search Console — Palabras clave', true, d.period_label);
    html += `<div class="card">` + d.search_console_queries.slice(0,15).map(q => pillRowKw(q.query||q.text||q.keys?.[0], num(q.clicks)+' clics', (q.clicks||0)/maxQClicks*100)).join('') + `</div>`;
    html += sectionClose();
  }

  document.getElementById('body').innerHTML = html || `<div class="empty-note">No hay secciones activas para este informe.</div>`;

  document.getElementById('anchorNav').innerHTML = renderedSupersecs.map(title => {
    const [icon] = SUPERSEC_ICONS[title] || ['●'];
    return `<a class="anchor-link" href="#sec-${SUPERSEC_SLUGS[title]||title}">${icon} ${esc(title)}</a>`;
  }).join('');

  if(d.footer_text){
    const fb = document.getElementById('footerBox');
    fb.textContent = d.footer_text;
    fb.style.display = 'block';
  }
}
</script>
</body>
</html>
